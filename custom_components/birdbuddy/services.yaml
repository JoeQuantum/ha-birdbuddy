collect_postcard:
  name: Collect a postcard
  description: Collect with Bird Buddy’s current server selection. Review the policy
    before enabling automatic collection. Unknown outcomes are not automatically retried.
  fields:
    postcard_id:
      name: Postcard ID
      description: The postcard_id from a Bird Buddy event.
      required: true
      selector:
        text: null
    selection_policy:
      name: Collection policy
      description: Explicitly accept the server selection. This does not preserve
        legacy recognized-only, mystery or confidence rules.
      required: true
      selector:
        select:
          options:
          - server
    identify:
      name: Identify before collecting
      description: Explicitly run inference first. Default is false.
      selector:
        boolean: null
    share:
      name: Request community sharing
      description: Default is false. The response reports sharing intent separately
        from confirmed collection.
      selector:
        boolean: null
    config_entry_id:
      name: Bird Buddy account
      description: Select the configured account. Required when account routing is
        ambiguous.
      selector:
        config_entry:
          integration: birdbuddy
    account_id:
      name: Bird Buddy account UUID
      description: Alternative account selector. All supplied targets must agree.
      selector:
        text: null
    device_id:
      name: Feeder device
      description: Optional device target; the postcard must belong to this feeder.
      selector:
        device:
          integration: birdbuddy
    feeder_id:
      name: Feeder ID
      description: Optional vendor feeder ID; all targets must agree.
      selector:
        text: null
get_postcard_details:
  name: Get postcard details
  description: Read every selected photo, video and species, including event overflow
    data. Returns a response without running inference or collecting.
  fields:
    postcard_id:
      name: Postcard ID
      description: The postcard_id from a Bird Buddy event.
      required: true
      selector:
        text: null
    config_entry_id:
      name: Bird Buddy account
      description: Select the configured account. Required when account routing is
        ambiguous.
      selector:
        config_entry:
          integration: birdbuddy
    account_id:
      name: Bird Buddy account UUID
      description: Alternative account selector. All supplied targets must agree.
      selector:
        text: null
    device_id:
      name: Feeder device
      description: Optional device target; the postcard must belong to this feeder.
      selector:
        device:
          integration: birdbuddy
    feeder_id:
      name: Feeder ID
      description: Optional vendor feeder ID; all targets must agree.
      selector:
        text: null
identify_postcard:
  name: Identify a postcard
  description: Explicitly run Bird Buddy inference. This changes analysis state and
    does not collect or share.
  fields:
    postcard_id:
      name: Postcard ID
      description: The postcard_id from a Bird Buddy event.
      required: true
      selector:
        text: null
    config_entry_id:
      name: Bird Buddy account
      description: Select the configured account. Required when account routing is
        ambiguous.
      selector:
        config_entry:
          integration: birdbuddy
    account_id:
      name: Bird Buddy account UUID
      description: Alternative account selector. All supplied targets must agree.
      selector:
        text: null
    device_id:
      name: Feeder device
      description: Optional device target; the postcard must belong to this feeder.
      selector:
        device:
          integration: birdbuddy
    feeder_id:
      name: Feeder ID
      description: Optional vendor feeder ID; all targets must agree.
      selector:
        text: null
backfill:
  name: Read historical visits
  description: Read bounded history and emit separate birdbuddy_postcard_backfill
    events. It does not identify or collect and does not emit the automatic-collection
    trigger event.
  fields:
    config_entry_id:
      name: Bird Buddy account
      description: Select the configured account. Required when account routing is
        ambiguous.
      selector:
        config_entry:
          integration: birdbuddy
    account_id:
      name: Bird Buddy account UUID
      description: Alternative account selector. All supplied targets must agree.
      selector:
        text: null
    max_pages:
      name: Maximum pages
      description: Stop with an error if the selected history cannot be fully read
        within this budget.
      default: 10
      selector:
        number:
          min: 1
          max: 100
          mode: box
retry_feed_items:
  name: Retry failed event delivery
  description: Requeue failed or dead-letter event delivery. This does not retry identification
    or collection. Automations listening for those events may act again.
  fields:
    config_entry_id:
      name: Bird Buddy account
      description: Select the configured account. Required when account routing is
        ambiguous.
      selector:
        config_entry:
          integration: birdbuddy
    account_id:
      name: Bird Buddy account UUID
      description: Alternative account selector. All supplied targets must agree.
      selector:
        text: null
    postcard_id:
      name: Postcard ID
      description: The postcard_id from a Bird Buddy event.
      required: false
      selector:
        text: null
acknowledge_postcard_retry:
  name: Allow retry of an uncertain action
  description: After checking the Bird Buddy app, acknowledge an unknown action outcome.
    This does not perform an action. A later separate identification or collection
    call is required.
  fields:
    config_entry_id:
      name: Bird Buddy account
      description: Select the configured account. Required when account routing is
        ambiguous.
      selector:
        config_entry:
          integration: birdbuddy
    account_id:
      name: Bird Buddy account UUID
      description: Alternative account selector. All supplied targets must agree.
      selector:
        text: null
    postcard_id:
      name: Postcard ID
      description: The postcard_id from a Bird Buddy event.
      required: true
      selector:
        text: null
    confirm:
      name: I checked the action outcome
      required: true
      selector:
        boolean: null
get_account_insights:
  name: Read account insights
  description: Read optional account data on demand and return it as a response. This
    does not create entities or change preferences, recognition, sharing, or feeder
    settings. The selected account and API must support the requested resource.
  fields:
    kind:
      name: Resource
      description: Choose the account resource to read.
      required: true
      selector:
        select:
          options:
            - hardware
            - preferences
            - species
            - named_birds
            - weekly_recap
            - yearly_review
            - feeder_report
            - remote_connections
    config_entry_id:
      name: Bird Buddy account
      description: Select the configured account. Required when account routing is ambiguous.
      selector:
        config_entry:
          integration: birdbuddy
    account_id:
      name: Bird Buddy account UUID
      description: Alternative account selector. All supplied selectors must agree.
      selector:
        text: null
    species_id:
      name: Species ID
      description: Required only for species. Use the stable vendor species ID, not its translated name.
      selector:
        text: null
    feeder_id:
      name: Feeder ID
      description: Only for feeder_report. The feeder must belong to the selected authenticated account.
      selector:
        text: null
    start:
      name: Report start
      description: Only for feeder_report, with end. Supply an ISO datetime with a timezone; the range may be at most 366 days.
      example: '2026-01-01T00:00:00Z'
      selector:
        text: null
    end:
      name: Report end
      description: Only for feeder_report, with start. This must be later than start. Returned report dates remain authoritative.
      example: '2026-02-01T00:00:00Z'
      selector:
        text: null
    limit:
      name: Selected list limit
      description: Maximum entries in each selected nested list, from 1 to 100. Omit for species. Other resources default to 50. This is a local result limit, not server pagination.
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
